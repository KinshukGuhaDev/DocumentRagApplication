<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#10b981" />
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#f59e0b" />
    </marker>
  </defs>

  <style>
    .flow-stream {
      stroke: #34d399;
      stroke-width: 2.2;
      stroke-dasharray: 6 5;
      animation: dashFlow 1.6s linear infinite;
      fill: none;
    }
    .flow-substream {
      stroke: #38bdf8;
      stroke-width: 1.8;
      stroke-dasharray: 5 4;
      animation: dashFlow 1.8s linear infinite;
      fill: none;
    }
    @keyframes dashFlow {
      from { stroke-dashoffset: 22; }
      to { stroke-dashoffset: 0; }
    }
    .tag-box {
      font-size: 10px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Banner Header -->
  <rect x="30" y="20" width="1140" height="60" rx="10" fill="url(#header-grad)" />
  <text x="55" y="46" fill="#ffffff" font-size="20" font-weight="700">Deep Dive: Multi-Format Document Ingestion Pipeline</text>
  <text x="55" y="65" fill="#e0f2fe" font-size="12">LoadFiles.py ➔ DataChunking.py ➔ EmbeddingManager.py ➔ VectorStore.py (ChromaDB)</text>
  
  <!-- STAGE 1: DOCUMENT LOADING & EXTRACTION -->
  <g transform="translate(30, 100)">
    <rect width="255" height="690" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect width="255" height="38" rx="10" fill="#132e27" />
    <text x="18" y="24" fill="#34d399" font-size="13" font-weight="700">1. MULTI-FORMAT LOADING</text>

    <!-- Source files box -->
    <rect x="15" y="55" width="225" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="25" y="78" fill="#38bdf8" font-size="12" font-weight="700">Specialized Extractors</text>

    <!-- PDF -->
    <rect x="25" y="90" width="205" height="30" rx="5" fill="#334155" />
    <text x="35" y="110" fill="#f8fafc" font-size="11" font-weight="600">📄 PDF:</text>
    <text x="80" y="110" fill="#94a3b8" font-size="10.5">PyMuPDFLoader (per page)</text>

    <!-- DOCX / TXT -->
    <rect x="25" y="125" width="205" height="30" rx="5" fill="#334155" />
    <text x="35" y="145" fill="#f8fafc" font-size="11" font-weight="600">📝 DOCX/TXT:</text>
    <text x="115" y="145" fill="#94a3b8" font-size="10.5">Docx2txt, UTF-8 Text</text>

    <!-- CSV / Excel -->
    <rect x="25" y="160" width="205" height="30" rx="5" fill="#334155" />
    <text x="35" y="180" fill="#f8fafc" font-size="11" font-weight="600">📊 CSV / XLSX:</text>
    <text x="115" y="180" fill="#94a3b8" font-size="10.5">DictReader, openpyxl</text>

    <!-- JSON / SQL -->
    <rect x="25" y="195" width="205" height="30" rx="5" fill="#334155" />
    <text x="35" y="215" fill="#f8fafc" font-size="11" font-weight="600">🗄️ JSON / SQL:</text>
    <text x="115" y="215" fill="#94a3b8" font-size="10.5">Recursive visit, ; split</text>

    <text x="25" y="245" fill="#94a3b8" font-size="10">• Auto extension validation</text>
    <text x="25" y="260" fill="#94a3b8" font-size="10">• Directory or single-file scan</text>
    <text x="25" y="275" fill="#94a3b8" font-size="10">• Graceful error tolerance</text>

    <!-- Metadata Enrichment Box -->
    <rect x="15" y="305" width="225" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="25" y="328" fill="#38bdf8" font-size="12" font-weight="700">Metadata &amp; Provenance</text>
    <text x="25" y="350" fill="#f1f5f9" font-size="11">Each Document stamped with:</text>
    <text x="25" y="372" fill="#a7f3d0" font-size="10.5">✓ source_file (e.g. report.pdf)</text>
    <text x="25" y="390" fill="#a7f3d0" font-size="10.5">✓ source_path (canonical abs path)</text>
    <text x="25" y="408" fill="#a7f3d0" font-size="10.5">✓ file_type &amp; content_type</text>
    <text x="25" y="426" fill="#a7f3d0" font-size="10.5">✓ document_id = SHA256(path)</text>
    <text x="25" y="444" fill="#a7f3d0" font-size="10.5">✓ row_number / sheet / page</text>

    <!-- Raw output note -->
    <rect x="15" y="475" width="225" height="195" rx="8" fill="#132438" stroke="#1d4ed8" stroke-width="1" />
    <text x="25" y="498" fill="#60a5fa" font-size="11.5" font-weight="700">Document Stream</text>
    <text x="25" y="520" fill="#cbd5e1" font-size="10.5">Emits standard LangChain</text>
    <text x="25" y="536" fill="#cbd5e1" font-size="10.5">Document objects containing</text>
    <text x="25" y="552" fill="#cbd5e1" font-size="10.5">clean extracted text ready</text>
    <text x="25" y="568" fill="#cbd5e1" font-size="10.5">for structural chunking.</text>
    <rect x="25" y="590" width="205" height="65" rx="5" fill="#0f172a" />
    <text x="35" y="612" fill="#38bdf8" font-size="10">PageContent: "..."</text>
    <text x="35" y="628" fill="#94a3b8" font-size="9.5">Metadata: {source, page,</text>
    <text x="35" y="642" fill="#94a3b8" font-size="9.5">document_id, file_type}</text>
  </g>

  <!-- STAGE 2: DATA CHUNKING -->
  <g transform="translate(315, 100)">
    <rect width="320" height="690" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect width="320" height="38" rx="10" fill="#162e3b" />
    <text x="18" y="24" fill="#38bdf8" font-size="13" font-weight="700">2. INTELLIGENT CHUNKING ENGINE</text>

    <!-- Strategies Container -->
    <rect x="15" y="55" width="290" height="305" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="25" y="78" fill="#34d399" font-size="12" font-weight="700">7 Chunking Strategies</text>

    <!-- Hybrid (Recommended) -->
    <rect x="22" y="90" width="276" height="52" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="32" y="108" fill="#6ee7b7" font-size="11" font-weight="700">★ HYBRID (Default &amp; File-Type Aware)</text>
    <text x="32" y="123" fill="#a7f3d0" font-size="10">• CSV/JSON/Excel ➔ Atomic rows (No split)</text>
    <text x="32" y="136" fill="#a7f3d0" font-size="10">• PDF/DOCX/TXT ➔ Sentence packing + overlap</text>

    <!-- Semantic -->
    <rect x="22" y="148" width="276" height="38" rx="6" fill="#334155" />
    <text x="32" y="165" fill="#f8fafc" font-size="10.5" font-weight="600">🧠 Semantic:</text>
    <text x="100" y="165" fill="#cbd5e1" font-size="10">Cosine similarity drops between</text>
    <text x="32" y="179" fill="#94a3b8" font-size="9.5">adjacent sentences trigger topic cuts</text>

    <!-- Agentic -->
    <rect x="22" y="192" width="276" height="38" rx="6" fill="#334155" />
    <text x="32" y="209" fill="#f8fafc" font-size="10.5" font-weight="600">🤖 Agentic:</text>
    <text x="95" y="209" fill="#cbd5e1" font-size="10">LLM structured TopicBoundaries</text>
    <text x="32" y="223" fill="#94a3b8" font-size="9.5">detection with SHA-256 prompt caching</text>

    <!-- Sentence-based -->
    <rect x="22" y="236" width="276" height="34" rx="6" fill="#334155" />
    <text x="32" y="252" fill="#f8fafc" font-size="10.5" font-weight="600">✍️ Sentence-based:</text>
    <text x="145" y="252" fill="#cbd5e1" font-size="10">spaCy en_core_web_sm</text>
    <text x="32" y="264" fill="#94a3b8" font-size="9.5">pack into token windows</text>

    <!-- Structured, Recursive, Fixed -->
    <rect x="22" y="276" width="276" height="34" rx="6" fill="#334155" />
    <text x="32" y="292" fill="#f8fafc" font-size="10" font-weight="600">📐 Structured:</text>
    <text x="105" y="292" fill="#cbd5e1" font-size="9.5">Headings (#, Chapter, Section)</text>
    <text x="32" y="304" fill="#94a3b8" font-size="9.5">Recursive &amp; Fixed-size splitters</text>

    <text x="25" y="332" fill="#94a3b8" font-size="10.5">Token measurement via <tspan fill="#38bdf8">tiktoken (cl100k_base)</tspan></text>
    <text x="25" y="348" fill="#94a3b8" font-size="10">Default size: 220 tokens | Min chunk: 44 tokens</text>

    <!-- Chunk Quality Controls -->
    <rect x="15" y="375" width="290" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="25" y="398" fill="#f59e0b" font-size="12" font-weight="700">Chunk Quality &amp; Overlap Guardrails</text>

    <text x="25" y="420" fill="#f1f5f9" font-size="11" font-weight="600">_healthy_chunks() Anti-Orphan:</text>
    <text x="25" y="436" fill="#94a3b8" font-size="10">• Chunks &lt; 20% chunk_size automatically merged</text>
    <text x="25" y="450" fill="#94a3b8" font-size="10">  into previous chunk if under capacity limit.</text>

    <text x="25" y="475" fill="#f1f5f9" font-size="11" font-weight="600">_apply_overlap() Context Retention:</text>
    <text x="25" y="492" fill="#94a3b8" font-size="10">• Backward whole-word sliding overlap (15%)</text>
    <text x="25" y="506" fill="#94a3b8" font-size="10">• Ensures cross-boundary semantic continuity</text>

    <!-- Chunk Metadata Box -->
    <rect x="15" y="540" width="290" height="130" rx="8" fill="#132e27" stroke="#10b981" stroke-width="1" />
    <text x="25" y="563" fill="#34d399" font-size="12" font-weight="700">Enriched Chunk Output</text>
    <text x="25" y="583" fill="#a7f3d0" font-size="10.5">chunk_id: SHA256(source|page|strategy|text)</text>
    <text x="25" y="601" fill="#a7f3d0" font-size="10.5">chunk_index: sequential position in doc</text>
    <text x="25" y="619" fill="#a7f3d0" font-size="10.5">chunk_strategy: hybrid-record / hybrid-prose</text>
    <text x="25" y="637" fill="#a7f3d0" font-size="10.5">token_count &amp; content_length validated</text>
    <text x="25" y="655" fill="#6ee7b7" font-size="10.5">✓ Ready for high-fidelity vector embedding</text>
  </g>

  <!-- STAGE 3: EMBEDDING & VECTOR STORAGE -->
  <g transform="translate(665, 100)">
    <rect width="505" height="690" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect width="505" height="38" rx="10" fill="#291a45" />
    <text x="18" y="24" fill="#c084fc" font-size="13" font-weight="700">3. EMBEDDING GENERATION &amp; CHROMADB PERSISTENCE</text>

    <!-- Embedding Manager -->
    <rect x="15" y="55" width="475" height="235" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="25" y="78" fill="#a855f7" font-size="12" font-weight="700">EmbeddingManager.py — Dual Provider Vector Engine</text>

    <!-- Model Types -->
    <g transform="translate(25, 90)">
      <rect width="220" height="60" rx="6" fill="#334155" />
      <text x="12" y="22" fill="#f8fafc" font-size="11" font-weight="700">Sentence-Transformers</text>
      <text x="12" y="38" fill="#38bdf8" font-size="10">all-MiniLM-L6-v2 (Local)</text>
      <text x="12" y="52" fill="#94a3b8" font-size="9.5">Dim: 384 • Offline • Fast GPU/CPU</text>

      <rect x="235" y="0" width="220" height="60" rx="6" fill="#334155" />
      <text x="247" y="22" fill="#f8fafc" font-size="11" font-weight="700">OpenAI Embeddings</text>
      <text x="247" y="38" fill="#38bdf8" font-size="10">text-embedding-3-small</text>
      <text x="247" y="52" fill="#94a3b8" font-size="9.5">Dim: 1536 • Cloud API • High capacity</text>
    </g>

    <!-- Validation safeguards -->
    <text x="25" y="175" fill="#f1f5f9" font-size="11" font-weight="600">Pre-Embedding Safeguards:</text>
    <text x="25" y="195" fill="#cbd5e1" font-size="10">• _validate_input_lengths(): Checks chunk tokens against model sequence ceiling (e.g. 512)</text>
    <text x="25" y="212" fill="#cbd5e1" font-size="10">• Batch processing (batch_size=32) with tqdm progress bars</text>
    <text x="25" y="230" fill="#cbd5e1" font-size="10">• L2 Normalization: Vectors normalized to unit sphere (Cosine Sim = Dot Product)</text>
    <text x="25" y="248" fill="#cbd5e1" font-size="10">• _validate_embeddings(): Asserts 2D matrix shape, checks for zero dimension or NaN values</text>
    <text x="25" y="266" fill="#34d399" font-size="10" font-weight="600">✓ Emits float32 vector matrix [N, D] aligned with document chunks</text>

    <!-- Vector Store Box -->
    <rect x="15" y="305" width="475" height="365" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <text x="25" y="328" fill="#f59e0b" font-size="12" font-weight="700">VectorStore.py — ChromaDB Persistent Storage</text>

    <g transform="translate(25, 345)">
      <!-- DB Specs -->
      <rect width="455" height="75" rx="6" fill="#141d2e" stroke="#334155" stroke-width="1" />
      <text x="15" y="22" fill="#f8fafc" font-size="11" font-weight="600">Collection: VECTOR_STORE_COLLECTION_NAME ("pdf_documents_cosine_v2")</text>
      <text x="15" y="39" fill="#94a3b8" font-size="10">Space: "hnsw:space": "cosine" • Disk Path: Database/vector_store</text>
      <text x="15" y="56" fill="#38bdf8" font-size="10">Client: chromadb.PersistentClient (automatic SQLite + index files)</text>

      <!-- Dimension Safety Guardrail -->
      <rect y="88" width="455" height="75" rx="6" fill="#451a03" stroke="#b45309" stroke-width="1" />
      <text x="15" y="108" fill="#fef3c7" font-size="11" font-weight="700">🛡️ Dimension Guardrail (_existing_dimension)</text>
      <text x="15" y="125" fill="#fed7aa" font-size="10">Inspects stored vector dimension vs new vectors. Throws explicit error</text>
      <text x="15" y="140" fill="#fed7aa" font-size="10">if switching models (e.g. 384 != 1536), preventing database corruption.</text>

      <!-- Idempotent Upsert -->
      <rect y="176" width="455" height="75" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <text x="15" y="196" fill="#a7f3d0" font-size="11" font-weight="700">🔄 Idempotent Upsert Logic</text>
      <text x="15" y="213" fill="#d1fae5" font-size="10">ID = SHA256(source_file | page | chunk_index | page_content)</text>
      <text x="15" y="228" fill="#d1fae5" font-size="10">Re-running ingestion updates existing IDs safely without duplicate entries.</text>

      <!-- Metadata Cleaning -->
      <rect y="264" width="455" height="48" rx="6" fill="#334155" />
      <text x="15" y="284" fill="#f8fafc" font-size="10.5" font-weight="600">_clean_metadata():</text>
      <text x="135" y="284" fill="#94a3b8" font-size="10">Flattens nested dicts/lists to string/int primitives</text>
      <text x="15" y="299" fill="#94a3b8" font-size="9.5">Guarantees 100% compliance with ChromaDB metadata typing requirements.</text>
    </g>
  </g>

  <!-- Connectors between stages -->
  <path d="M 285 440 L 315 440" class="flow-stream" marker-end="url(#arrow-green)" />
  <path d="M 635 440 L 665 440" class="flow-stream" marker-end="url(#arrow-green)" />

</svg>
